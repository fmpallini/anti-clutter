name: Lint da lista

on:
  push:
    paths: ['filter/**', 'aglint.config.json', 'tools/package*.json', '.github/workflows/lint.yml']
  pull_request:
    paths: ['filter/**', 'aglint.config.json', 'tools/package*.json', '.github/workflows/lint.yml']

jobs:
  aglint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools
      - run: npm run lint
        working-directory: tools
